name: Build luci-app-singbox-ui artifacts
run-name: "Build artifacts (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }})"

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.pkg_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg_type: [ipk, apk]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Inject git version into Makefile
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          DATE_TAG=$(date +%Y%m%d%H%M)
          SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-7)
          sed -i "s/^PKG_RELEASE:=.*/PKG_RELEASE:=git.${DATE_TAG}.${SHORT_SHA}/" luci-app-singbox-ui/Makefile

      - name: Build Docker image (${{ matrix.pkg_type }})
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile-${{ matrix.pkg_type }}
          tags: singbox-ui-${{ matrix.pkg_type }}:ci

      - name: Create Docker container
        run: docker create --name singbox-ui-${{ matrix.pkg_type }} singbox-ui-${{ matrix.pkg_type }}:ci

      - name: Copy built package from Docker container
        run: |
          mkdir -p ./artifacts-${{ matrix.pkg_type }}
          docker cp singbox-ui-${{ matrix.pkg_type }}:/builder/bin/packages/x86_64/luci/. ./bin-${{ matrix.pkg_type }}/
          if [ "${{ matrix.pkg_type }}" = "ipk" ]; then
            cp ./bin-${{ matrix.pkg_type }}/luci-app-singbox-ui*.ipk ./artifacts-${{ matrix.pkg_type }}/
          else
            cp ./bin-${{ matrix.pkg_type }}/luci-app-singbox-ui*.apk ./artifacts-${{ matrix.pkg_type }}/
          fi

      - name: Remove Docker container
        if: always()
        run: docker rm -f singbox-ui-${{ matrix.pkg_type }} || true

      - name: Rename and upload artifact
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXT: ${{ matrix.pkg_type }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          DATE=$(date +%Y%m%d-%H%M)
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SAFE_TITLE=$(echo "$PR_TITLE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g' | sed -E 's/^-+|-+$//g')
            NEW_NAME="luci-app-singbox-ui-pr-${PR_NUM}-${SAFE_TITLE}-${DATE}.${EXT}"
          else
            SHORT_SHA=$(echo "$HEAD_SHA" | cut -c1-7)
            SAFE_BRANCH=$(echo "$BRANCH_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g')
            NEW_NAME="luci-app-singbox-ui-${SAFE_BRANCH}-${SHORT_SHA}-${DATE}.${EXT}"
          fi
          for f in artifacts-$EXT/*.$EXT; do
            [ -f "$f" ] || continue
            mv "$f" "artifacts-$EXT/${NEW_NAME}"
            break
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: built-${{ matrix.pkg_type }}
          path: artifacts-${{ matrix.pkg_type }}/

  commit:
    name: Save runner artifacts to artifacts branch
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.event_name == 'pull_request'
    concurrency:
      group: artifacts-branch-push
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0

      - name: Switch to artifacts branch
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" || true
          if git show-ref --verify --quiet "refs/remotes/origin/artifacts"; then
            git switch -C artifacts origin/artifacts
          elif git show-ref --verify --quiet "refs/heads/artifacts"; then
            git switch artifacts
          else
            git switch --orphan artifacts
            git rm -rf . || true
          fi

      - name: Download ipk artifact
        uses: actions/download-artifact@v4
        with:
          name: built-ipk
          path: ./new-ipk/

      - name: Download apk artifact
        uses: actions/download-artifact@v4
        with:
          name: built-apk
          path: ./new-apk/

      - name: Determine Target Branch Folder
        id: branch_folder
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TARGET_BRANCH="${{ github.base_ref }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          if [ "$TARGET_BRANCH" != "dev" ]; then
            TARGET_BRANCH="main"
          fi
          echo "folder=$TARGET_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Copy to target branch folders
        env:
          TARGET: ${{ steps.branch_folder.outputs.folder }}
        run: |
          mkdir -p "${TARGET}/ipk" "${TARGET}/apk"
          cp -n ./new-ipk/*.ipk "${TARGET}/ipk/" 2>/dev/null || true
          cp -n ./new-apk/*.apk "${TARGET}/apk/" 2>/dev/null || true

      - name: Remove old files (>= 7 days) in target branch
        env:
          TARGET: ${{ steps.branch_folder.outputs.folder }}
        run: |
          for ext in ipk apk; do
            for file in "${TARGET}/${ext}"/*."${ext}"; do
              [ -f "$file" ] || continue
              basename=$(basename "$file")
              date_part=$(echo "$basename" | sed -E 's/.*-([0-9]{8}-[0-9]{4})\.'${ext}'$/\1/')
              if [[ "$date_part" =~ ^[0-9]{8}-[0-9]{4}$ ]]; then
                ymd=${date_part:0:8}
                hm=${date_part:9:4}
                h=${hm:0:2}
                m=${hm:2:2}
                file_date=$(date -d "${ymd:0:4}-${ymd:4:2}-${ymd:6:2} ${h}:${m}:00" +%s)
                now=$(date +%s)
                diff=$(( (now - file_date) / 86400 ))
                if [ "$diff" -ge 7 ]; then
                  echo "Deleting old file: $file"
                  rm "$file"
                fi
              fi
            done
          done

      - name: Update index.txt for target branch
        env:
          TARGET: ${{ steps.branch_folder.outputs.folder }}
        run: |
          shopt -s nullglob
          for ext in ipk apk; do
            files=("${TARGET}/${ext}"/*."${ext}")
            if [ ${#files[@]} -eq 0 ]; then
              echo "" > "${TARGET}/${ext}/index.txt"
            else
              printf "%s\n" "${files[@]##*/}" > "${TARGET}/${ext}/index.txt"
            fi
          done

      - name: Commit and push changes
        env:
          TARGET: ${{ steps.branch_folder.outputs.folder }}
        run: |
          echo "📤 Committing updated packages for ${TARGET} to artifacts branch"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "${TARGET}/ipk/" "${TARGET}/apk/"
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              MSG="github-actions[bot]: update ${TARGET} ipk/apk from PR #${{ github.event.pull_request.number }}"
            else
              SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
              MSG="github-actions[bot]: update ${TARGET} ipk/apk from commit ${SHORT_SHA}"
            fi
            git commit -m "$MSG"
            git push origin HEAD:artifacts
          fi

      - name: Trigger openwrt-repo sync
        if: success()
        env:
          REPO_SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          if [ -n "$REPO_SYNC_TOKEN" ]; then
            echo "Triggering openwrt-repo sync via repository_dispatch..."
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $REPO_SYNC_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/mrvokintos/openwrt-repo/dispatches \
              -d '{"event_type": "ui-updated"}'
            echo "Dispatch triggered successfully!"
          else
            echo "Notice: REPO_SYNC_TOKEN not set, skipping openwrt-repo dispatch."
          fi
