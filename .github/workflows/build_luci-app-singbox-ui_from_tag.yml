name: Release luci-app-singbox-ui
run-name: Release ${{ inputs.tag_name }} (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag version (e.g. v1.0.0-rc1 or v1.0.0)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - prerelease
          - release
        default: prerelease
      target_branch:
        description: "Target branch"
        required: true
        type: string
        default: "main"

permissions:
  contents: write

jobs:
  sync-version:
    name: Sync Version To Branch
    runs-on: ubuntu-latest
    outputs:
      tag_version: ${{ steps.tag.outputs.tag_version }}
      target_branch: ${{ steps.branch.outputs.target_branch }}
      sync_sha: ${{ steps.sync.outputs.sync_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Parse Tag Version
        id: tag
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"

          if [ "$TAG_VERSION" = "$TAG_NAME" ]; then
            echo "Tag must start with 'v' (example: v1.2.3)." >&2
            exit 1
          fi

          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag version: $TAG_VERSION" >&2
            exit 1
          fi

          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Target Branch
        id: branch
        shell: bash
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          echo "target_branch=${TARGET_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: Sync Version In Makefile And Push
        id: sync
        shell: bash
        env:
          TAG_VERSION: ${{ steps.tag.outputs.tag_version }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          # v1.0.0-rc1 -> 1.0.0_rc1: apk не принимает "-" в версии; ipk берёт ту же
          # v1.0.0-rc1 -> 1.0.0_rc1: apk rejects "-" in a version; ipk uses the same
          PACKAGE_VERSION="$(printf '%s' "${TAG_VERSION}" | sed -E 's/-(alpha|beta|pre|rc|p)[.-]?([0-9]*)$/_\1\2/')"
          sed -i "s/^PKG_VERSION:=.*$/PKG_VERSION:=${PACKAGE_VERSION}/" luci-app-singbox-ui/Makefile
          sed -i "s/^PKG_RELEASE:=.*$/PKG_RELEASE:=1/" luci-app-singbox-ui/Makefile
          sed -i "s/^const UI_VERSION='[^']*'/const UI_VERSION='${PACKAGE_VERSION}'/" \
            luci-app-singbox-ui/htdocs/luci-static/resources/view/singbox-ui/singbox-ui.js

          if git diff --quiet; then
            echo "No version changes detected."
          else
            git add luci-app-singbox-ui/Makefile luci-app-singbox-ui/htdocs/luci-static/resources/view/singbox-ui/singbox-ui.js
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "github-actions[bot]: sync Makefile version to v${TAG_VERSION}"

            git push origin "HEAD:${TARGET_BRANCH}"
          fi

          echo "sync_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.pkg_type }})
    runs-on: ubuntu-latest
    needs: sync-version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Official OpenWrt SDK images: https://hub.docker.com/r/openwrt/sdk
          - pkg_type: ipk
            sdk_tag: x86-64-24.10.8
          - pkg_type: apk
            sdk_tag: x86-64-25.12.6

    steps:
      - name: Checkout Synced Commit
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ needs.sync-version.outputs.sync_sha }}
          fetch-depth: 0

      - name: Ensure Version Equals Tag
        shell: bash
        env:
          TAG_VERSION: ${{ needs.sync-version.outputs.tag_version }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(printf '%s' "${TAG_VERSION}" | sed -E 's/-(alpha|beta|pre|rc|p)[.-]?([0-9]*)$/_\1\2/')"
          grep -qx "PKG_VERSION:=${PACKAGE_VERSION}" luci-app-singbox-ui/Makefile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build package with OpenWrt SDK ${{ matrix.sdk_tag }}
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile
          build-args: SDK_TAG=${{ matrix.sdk_tag }}
          outputs: type=local,dest=./bin-${{ matrix.pkg_type }}

      - name: Collect built package
        shell: bash
        env:
          EXT: ${{ matrix.pkg_type }}
        run: |
          set -euo pipefail
          mkdir -p ./pkg-out
          ls -l "./bin-$EXT"
          cp ./bin-"$EXT"/luci-app-singbox-ui*."$EXT" "./pkg-out/luci-app-singbox-ui.$EXT"

      - name: Upload Built Package
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pkg-${{ matrix.pkg_type }}
          path: pkg-out/

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - sync-version
      - build

    steps:
      - name: Download IPK Artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-ipk
          path: release-ipk/

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-apk
          path: release-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.4.0
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ needs.sync-version.outputs.sync_sha }}
          name: ${{ inputs.tag_name }}
          files: |
            release-ipk/*.ipk
            release-apk/*.apk
          draft: false
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          generate_release_notes: true

      - name: Trigger openwrt-repo sync
        if: success()
        env:
          REPO_SYNC_TOKEN: ${{ secrets.REPO_SYNC_TOKEN }}
        run: |
          if [ -n "$REPO_SYNC_TOKEN" ]; then
            echo "Triggering openwrt-repo sync via repository_dispatch..."
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $REPO_SYNC_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/mrvokintos/openwrt-repo/dispatches \
              -d '{"event_type": "ui-updated"}'
            echo "Dispatch triggered successfully!"
          else
            echo "Notice: REPO_SYNC_TOKEN not set, skipping openwrt-repo dispatch."
          fi
