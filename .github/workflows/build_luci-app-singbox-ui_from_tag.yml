name: Release luci-app-singbox-ui
run-name: Release ${{ inputs.tag_name }} (${{ inputs.release_type }})

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag version (e.g. v3.1.0-rc5 or v3.1.0)"
        required: true
        type: string
      release_type:
        description: "Release type"
        required: true
        type: choice
        options:
          - prerelease
          - release
        default: prerelease
      target_branch:
        description: "Target branch"
        required: true
        type: string
        default: "main"

permissions:
  contents: write

jobs:
  sync-version:
    name: Sync Version To Branch
    runs-on: ubuntu-latest
    outputs:
      tag_version: ${{ steps.tag.outputs.tag_version }}
      target_branch: ${{ steps.branch.outputs.target_branch }}
      sync_sha: ${{ steps.sync.outputs.sync_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Parse Tag Version
        id: tag
        shell: bash
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          TAG_VERSION="${TAG_NAME#v}"

          if [ "$TAG_VERSION" = "$TAG_NAME" ]; then
            echo "Tag must start with 'v' (example: v1.2.3)." >&2
            exit 1
          fi

          if ! [[ "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid tag version: $TAG_VERSION" >&2
            exit 1
          fi

          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Target Branch
        id: branch
        shell: bash
        run: |
          echo "target_branch=${{ inputs.target_branch }}" >> "$GITHUB_OUTPUT"

      - name: Sync Version In Makefile And Push
        id: sync
        shell: bash
        env:
          TAG_VERSION: ${{ steps.tag.outputs.tag_version }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail

          PACKAGE_VERSION="$(printf '%s' "${TAG_VERSION}" | sed -E 's/-(alpha|beta|pre|rc|p)[.-]?([0-9]*)$/_\1\2/')"
          sed -i "s/^PKG_VERSION:=.*$/PKG_VERSION:=${PACKAGE_VERSION}/" luci-app-singbox-ui/Makefile

          if git diff --quiet; then
            echo "No version changes detected."
          else
            git add luci-app-singbox-ui/Makefile
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "github-actions[bot]: sync Makefile version to v${TAG_VERSION}"

            git push origin "HEAD:${TARGET_BRANCH}"
          fi

          echo "sync_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.pkg_type }})
    runs-on: ubuntu-latest
    needs: sync-version
    strategy:
      fail-fast: false
      matrix:
        pkg_type: [ipk, apk]

    steps:
      - name: Checkout Synced Commit
        uses: actions/checkout@v5.0.0
        with:
          ref: ${{ needs.sync-version.outputs.sync_sha }}
          fetch-depth: 0

      - name: Ensure Version Equals Tag
        shell: bash
        env:
          TAG_VERSION: ${{ needs.sync-version.outputs.tag_version }}
          PKG_TYPE: ${{ matrix.pkg_type }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="${TAG_VERSION}"
          if [ "${PKG_TYPE}" = "apk" ]; then
            PACKAGE_VERSION="$(printf '%s' "${TAG_VERSION}" | sed -E 's/-(alpha|beta|pre|rc|p)[.-]?([0-9]*)$/_\1\2/')"
          fi
          sed -i "s/^PKG_VERSION:=.*$/PKG_VERSION:=${PACKAGE_VERSION}/" luci-app-singbox-ui/Makefile

      - name: Build Docker Image (${{ matrix.pkg_type }})
        uses: docker/build-push-action@v6.18.0
        with:
          context: .
          file: Dockerfile-${{ matrix.pkg_type }}
          tags: singbox-ui-${{ matrix.pkg_type }}:ci

      - name: Create Docker Container
        run: docker create --name singbox-ui-${{ matrix.pkg_type }} singbox-ui-${{ matrix.pkg_type }}:ci

      - name: Copy Package From Docker Container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./pkg-out
          docker cp singbox-ui-${{ matrix.pkg_type }}:/builder/bin/packages/x86_64/luci/. ./bin-${{ matrix.pkg_type }}/
          if [ "${{ matrix.pkg_type }}" = "ipk" ]; then
            cp ./bin-${{ matrix.pkg_type }}/luci-app-singbox-ui*.ipk ./pkg-out/luci-app-singbox-ui.ipk
          else
            cp ./bin-${{ matrix.pkg_type }}/luci-app-singbox-ui*.apk ./pkg-out/luci-app-singbox-ui.apk
          fi

      - name: Remove Docker Container
        if: always()
        run: docker rm -f singbox-ui-${{ matrix.pkg_type }} || true

      - name: Upload Built Package
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pkg-${{ matrix.pkg_type }}
          path: pkg-out/

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - sync-version
      - build

    steps:
      - name: Download IPK Artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-ipk
          path: release-ipk/

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: pkg-apk
          path: release-apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2.4.0
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ needs.sync-version.outputs.sync_sha }}
          name: ${{ inputs.tag_name }}
          files: |
            release-ipk/*.ipk
            release-apk/*.apk
          draft: false
          prerelease: ${{ inputs.release_type == 'prerelease' }}
          generate_release_notes: true
